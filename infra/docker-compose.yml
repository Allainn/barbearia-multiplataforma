services:

  # ─────────────────────────────────────────────
  # Prometheus — coleta e armazenamento de métricas
  # ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver   # aceita push do Tempo metrics-generator
      - --web.enable-lifecycle
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    ports:
      - "9090:9090"
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Loki — agregação e armazenamento de logs
  # ─────────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./config/loki/loki.yml:/etc/loki/loki.yml:ro
      - ./data/loki:/loki
    ports:
      - "3100:3100"
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────
  # Tempo — armazenamento e consulta de traces
  # ─────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.4.0
    container_name: tempo
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./config/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - ./data/tempo:/var/tempo
    ports:
      - "3200:3200"   # HTTP API / Grafana
      - "4317:4317"   # OTLP gRPC  (recebe traces das apps via OTel Collector)
      - "4318:4318"   # OTLP HTTP
    networks:
      - observability
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────
  # OpenTelemetry Collector — roteador de telemetria
  # Recebe OTLP das aplicações e distribui para cada backend
  # ─────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    container_name: otel-collector
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./config/otel-collector/config.yml:/etc/otelcol/config.yml:ro
    ports:
      - "4319:4317"   # OTLP gRPC  — apps enviam para esta porta
      - "4320:4318"   # OTLP HTTP  — apps enviam para esta porta
      - "8889:8889"   # Métricas do próprio Collector (scraped pelo Prometheus)
    networks:
      - observability
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # Grafana — visualização unificada dos três pilares
  # ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor correlations
      GF_SERVER_ROOT_URL: http://localhost:3333
      GF_LOG_FILTERS: "authn.service:error"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./data/grafana:/var/lib/grafana
    ports:
      - "3333:3000"
    networks:
      - observability
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────
  # Keycloak — Identity Provider (HTTP puro, sem TLS)
  # Admin UI: http://localhost:8080
  # ─────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.0
    container_name: keycloak
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./config/keycloak/keycloak.conf:/opt/keycloak/conf/keycloak.conf:ro
      - ./data/keycloak:/opt/keycloak/data
    ports:
      - "8080:8080"   # App principal — login, Admin UI, token endpoints
      - "9000:9000"   # Management — /health e /metrics (Prometheus scrape)
    networks:
      - observability
    # curl não existe na imagem UBI do KC 26 — usa bash /dev/tcp para checar a porta 9000
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

  # ─────────────────────────────────────────────
  # Kafka (KRaft — sem Zookeeper) + Kafka UI
  # ─────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      # PLAINTEXT (kafka:9092) -- pros containers na rede Docker (todos os services existentes).
      # PLAINTEXT_HOST (localhost:29092) -- só pra processo rodando FORA do Docker (ex: os
      # scaffolds Java de CQRS em encontros/encontro-3/scaffolds/, que sobem com java -jar direto
      # no host, não em container). Sem isso, o client recebe "kafka:9092" no metadata de resposta
      # e falha com UnknownHostException -- "kafka" só resolve dentro da rede Docker.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"   # UUID fixo para KRaft
    volumes:
      - ./data/kafka:/var/lib/kafka/data
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - observability
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ─────────────────────────────────────────────
  # Inicialização idempotente dos tópicos da aplicação
  # ─────────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    restart: "no"
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic agendamento.criado --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic agendamento.cancelado --partitions 3 --replication-factor 1
    networks:
      - observability
    depends_on:
      kafka:
        condition: service_healthy

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    command: --kafka.server=kafka:9092
    ports:
      - "9308:9308"
    networks:
      - observability
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      KAFKA_CLUSTERS_0_NAME: barbearia
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    networks:
      - observability
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # ─────────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: barbearia
      POSTGRES_PASSWORD: barbearia
      POSTGRES_DB: barbearia
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - observability
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barbearia -d barbearia"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Serviços da plataforma de agendamento
  # ─────────────────────────────────────────────
  bff-gateway:
    build: ../services/bff-gateway
    container_name: bff-gateway
    restart: unless-stopped
    environment:
      BARBEARIA_URL: http://barbearia-service:8001
      AGENDAMENTO_URL: http://agendamento-service:8012
      DISPONIBILIDADE_URL: http://disponibilidade-service:8003
      KEYCLOAK_URL: http://keycloak:8080/realms/barbearia
      KEYCLOAK_CLIENT_ID: bff-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "8010:8010"
    networks:
      - observability
    depends_on:
      keycloak:
        condition: service_healthy
      barbearia-service:
        condition: service_started
      agendamento-service:
        condition: service_started
      disponibilidade-service:
        condition: service_started

  barbearia-service:
    build: ../services/barbearia-service
    image: ghcr.io/allainn/barbearia-multiplataforma/barbearia-service:latest
    container_name: barbearia-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://barbearia_svc:barbearia_pass@postgres:5432/barbearia?options=-csearch_path%3Dbarbearia
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: barbearia-service
    ports:
      - "8001:8001"
    networks:
      - observability
    depends_on:
      postgres:
        condition: service_healthy

  agendamento-service:
    build: ../services/agendamento-service
    container_name: agendamento-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/barbearia?currentSchema=agendamento
      SPRING_DATASOURCE_USERNAME: agendamento_svc
      SPRING_DATASOURCE_PASSWORD: agendamento_pass
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: agendamento-service
    ports:
      - "8012:8012"
    networks:
      - observability
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  disponibilidade-service:
    build: ../services/disponibilidade-service
    container_name: disponibilidade-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://disponibilidade_svc:disponibilidade_pass@postgres:5432/barbearia?options=-csearch_path%3Ddisponibilidade
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: disponibilidade-service
    ports:
      - "8003:8003"
    networks:
      - observability
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  notificacao-service:
    build: ../services/notificacao-service
    container_name: notificacao-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://notificacao_svc:notificacao_pass@postgres:5432/barbearia?options=-csearch_path%3Dnotificacao
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: notificacao-service
    ports:
      - "8004:8004"
    networks:
      - observability
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

networks:
  observability:
    name: observability
    driver: bridge
