global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: local
    env: development

scrape_configs:

  # Prometheus em si
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Métricas das aplicações expostas via OTel Collector
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  # Métricas internas do Loki
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']

  # Métricas internas do Tempo
  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']

  # Métricas do Keycloak (management port 9000)
  - job_name: keycloak
    static_configs:
      - targets: ['keycloak:9000']
    metrics_path: /metrics

  # Métricas do Kafka via kafka-exporter
  - job_name: kafka-exporter
    static_configs:
      - targets: ['kafka-exporter:9308']
