apiVersion: 1

providers:
  - name: observabilidade
    orgId: 1
    folder: Observabilidade
    folderUid: observabilidade
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
