apiVersion: 1

datasources:

  # ── Prometheus ───────────────────────────────
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    access: proxy
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      # Liga exemplars do Prometheus direto ao trace no Tempo
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo

  # ── Loki ─────────────────────────────────────
  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    access: proxy
    jsonData:
      # Extrai o traceId do campo JSON do log e cria link para o Tempo
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherValue: traceId
          url: "${__value.raw}"
          datasourceUid: tempo
          urlDisplayLabel: "Abrir trace"
        # Fallback para logs que carregam traceId no corpo JSON
        - name: TraceID (body)
          matcherType: regex
          matcherValue: '"traceId"\s*:\s*"(\w+)"'
          url: "${__value.raw}"
          datasourceUid: tempo
          urlDisplayLabel: "Abrir trace"

  # ── Tempo ─────────────────────────────────────
  - name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo:3200
    access: proxy
    jsonData:
      httpMethod: GET
      # Mapa de serviços gerado pelo metrics_generator do Tempo
      serviceMap:
        datasourceUid: prometheus
      # Grafo de nós habilitado
      nodeGraph:
        enabled: true
      # De trace → logs relacionados no Loki
      traceToLogs:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: false
        tags:
          - key: service.name
            value: service_name
      # De trace → métricas relacionadas no Prometheus
      traceToMetrics:
        datasourceUid: prometheus
        tags:
          - key: service.name
            value: service
        queries:
          - name: "Request Rate"
            query: 'rate(app_http_server_duration_milliseconds_count{service="$${__tags.service}"}[5m])'
          - name: "Error Rate"
            query: 'rate(app_http_server_duration_milliseconds_count{service="$${__tags.service}", http_status_code=~"5.."}[5m])'
      # Busca de traces por log no Loki
      lokiSearch:
        datasourceUid: loki
      # TraceQL editor habilitado
      search:
        hide: false
