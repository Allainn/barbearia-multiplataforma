# ──────────────────────────────────────────────────────────
# Keycloak 26 — configuração de desenvolvimento (HTTP puro)
# ──────────────────────────────────────────────────────────

# Banco de dados: H2 em arquivo (persiste em ./data/keycloak)
db=dev-file

# HTTP — sem TLS
http-enabled=true
http-port=8080

# Desabilita qualquer exigência de HTTPS ou hostname estrito
hostname-strict=false

# Endpoints de saúde e métricas (Prometheus scrape)
health-enabled=true
metrics-enabled=true

# Log
log-level=INFO
