receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

  # Garante que service.name esteja presente como label no Loki
  resource:
    attributes:
      - action: insert
        key: loki.resource.labels
        value: service.name, service.version, service.namespace

  # Adiciona o trace_id como campo nos logs para correlação no Grafana
  transform/logs:
    log_statements:
      - context: log
        statements:
          - set(attributes["traceId"], trace_id.string) where trace_id != nil

exporters:

  # Traces → Tempo
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Métricas → Prometheus (scrape via porta 8889)
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: app
    send_timestamps: true
    enable_open_metrics: true
    resource_to_telemetry_conversion:
      enabled: true   # promove service.name, service.namespace etc. como labels Prometheus

  # Logs → Loki
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [resource, transform/logs, batch]
      exporters: [loki]
  telemetry:
    logs:
      level: warn
