openapi: 3.0.3

info:
  title: Barbearia — API da plataforma (bff-gateway)
  version: 1.0.0
  description: |
    Única entrada pública da plataforma de agendamento. Toda chamada passa pelo **bff-gateway**,
    que autentica a requisição, aplica a autorização por papel e encaminha para o serviço
    responsável. Os serviços internos (barbearia, agendamento, disponibilidade) não são
    alcançáveis de fora.

    ## Autenticação

    Bearer token JWT emitido pelo **Keycloak** (realm `barbearia`). O BFF verifica, em toda
    requisição: assinatura RS256 contra o JWKS do realm, `exp`, `iss` e `aud` (que precisa conter
    `bff-gateway`). Qualquer falha é **401** com o header `WWW-Authenticate: Bearer` descrevendo o
    motivo. O corpo não revela o motivo.

    Para obter um token no ambiente local (fluxo *password*, só para a primeira versão sem front-end):

    ```bash
    curl -s -X POST http://localhost:8080/realms/barbearia/protocol/openid-connect/token \
      -d grant_type=password -d client_id=bff-gateway -d client_secret=bff-secret \
      -d username=cliente1 -d password=cliente123 | jq -r .access_token
    ```

    Usuários do ambiente local: `cliente1` / `cliente123` e `cliente2` / `cliente123` (role
    `cliente`); `gestor1` / `gestor123` (role `gestor`).

    ## Autorização

    RBAC com duas roles, lidas da claim `realm_access.roles` do token:

    | Role | Pode |
    |---|---|
    | qualquer usuário autenticado | consultar barbearias, profissionais, serviços e horários livres |
    | `gestor` | cadastrar barbearias, profissionais e serviços |
    | `cliente` | reservar e cancelar os próprios horários |

    Role insuficiente é **403**. A identidade do chamador (claim `sub`) é repassada aos serviços no
    header interno `X-User-ID`; no agendamento ela vira o `cliente_id` da reserva, e o corpo da
    requisição não pode escolher outro.

    ## Formato de erro

    Todo erro tem o corpo `{"detail": ...}`. Nos erros produzidos pelo BFF e pelo agendamento,
    `detail` é uma string. Nos **422** dos serviços em FastAPI (barbearia e disponibilidade),
    `detail` é a lista de erros de validação do Pydantic.

    ## Decisões

    - [ADR-0009](https://github.com/Allainn/barbearia-multiplataforma/blob/main/docs/adr/0009-seguranca-keycloak-e-validacao-jwt.md): Keycloak como provedor de identidade.
    - [ADR-0014](https://github.com/Allainn/barbearia-multiplataforma/blob/main/docs/adr/0014-modelo-de-autorizacao-rbac.md): modelo de autorização RBAC.
    - [ADR-0015](https://github.com/Allainn/barbearia-multiplataforma/blob/main/docs/adr/0015-onde-autenticar-e-autorizar.md): autenticação e autorização na borda.
  contact:
    name: Repositório
    url: https://github.com/Allainn/barbearia-multiplataforma

servers:
  - url: http://localhost:8010
    description: Ambiente local (Docker Compose)

tags:
  - name: Barbearias
    description: Cadastro e consulta de barbearias, profissionais e serviços. Servido pelo barbearia-service.
  - name: Disponibilidade
    description: Horários livres de um profissional (read model do CQRS). Servido pelo disponibilidade-service.
  - name: Agendamentos
    description: Reserva e cancelamento de horários. Servido pelo agendamento-service.
  - name: Saúde
    description: Liveness do próprio BFF.

security:
  - bearerAuth: []

paths:

  /barbearias:
    get:
      tags: [Barbearias]
      summary: Lista as barbearias da plataforma
      description: Qualquer usuário autenticado. Ordenado por nome.
      operationId: listarBarbearias
      parameters:
        - $ref: '#/components/parameters/DemoDelay'
      responses:
        '200':
          description: Lista de barbearias (pode ser vazia).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Barbearia'
              example:
                - id: 11111111-1111-1111-1111-111111111111
                  nome: Barbearia Centro
                  endereco: Rua da Bahia 1000
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '503': { $ref: '#/components/responses/ServicoIndisponivel' }
    post:
      tags: [Barbearias]
      summary: Cadastra uma barbearia
      description: |
        Exige a role **`gestor`**. Na primeira versão qualquer gestor cadastra qualquer barbearia:
        o isolamento por tenant ficou para a versão seguinte (ADR-0014).
      operationId: criarBarbearia
      parameters:
        - $ref: '#/components/parameters/DemoDelay'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BarbeariaIn'
            example:
              nome: Barbearia Savassi
              endereco: Rua Pernambuco 1200
      responses:
        '201':
          description: Barbearia criada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Barbearia'
              example:
                id: f0b96a69-01f4-42b6-9ce1-cb04b014997d
                nome: Barbearia Savassi
                endereco: Rua Pernambuco 1200
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '422': { $ref: '#/components/responses/ValidacaoFastAPI' }
        '503': { $ref: '#/components/responses/ServicoIndisponivel' }

  /barbearias/{barbeariaId}/profissionais:
    parameters:
      - $ref: '#/components/parameters/BarbeariaId'
    get:
      tags: [Barbearias]
      summary: Lista os profissionais de uma barbearia
      description: Qualquer usuário autenticado. Ordenado por nome.
      operationId: listarProfissionais
      parameters:
        - $ref: '#/components/parameters/DemoDelay'
      responses:
        '200':
          description: Profissionais da barbearia.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Profissional'
              example:
                - id: 22222222-2222-2222-2222-222222222222
                  barbearia_id: 11111111-1111-1111-1111-111111111111
                  nome: Carlos
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/BarbeariaNaoEncontrada' }
        '422': { $ref: '#/components/responses/ValidacaoFastAPI' }
        '503': { $ref: '#/components/responses/ServicoIndisponivel' }
    post:
      tags: [Barbearias]
      summary: Cadastra um profissional na barbearia
      description: Exige a role **`gestor`**.
      operationId: criarProfissional
      parameters:
        - $ref: '#/components/parameters/DemoDelay'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfissionalIn'
            example:
              nome: Ana
      responses:
        '201':
          description: Profissional criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profissional'
              example:
                id: 7a1c2b3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                barbearia_id: 11111111-1111-1111-1111-111111111111
                nome: Ana
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/BarbeariaNaoEncontrada' }
        '422': { $ref: '#/components/responses/ValidacaoFastAPI' }
        '503': { $ref: '#/components/responses/ServicoIndisponivel' }

  /barbearias/{barbeariaId}/servicos:
    parameters:
      - $ref: '#/components/parameters/BarbeariaId'
    get:
      tags: [Barbearias]
      summary: Lista os serviços de uma barbearia
      description: Qualquer usuário autenticado. Ordenado por nome.
      operationId: listarServicos
      parameters:
        - $ref: '#/components/parameters/DemoDelay'
      responses:
        '200':
          description: Serviços da barbearia.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Servico'
              example:
                - id: 33333333-3333-3333-3333-333333333333
                  barbearia_id: 11111111-1111-1111-1111-111111111111
                  nome: Corte
                  duracao_min: 30
                  preco: "40.00"
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/BarbeariaNaoEncontrada' }
        '422': { $ref: '#/components/responses/ValidacaoFastAPI' }
        '503': { $ref: '#/components/responses/ServicoIndisponivel' }
    post:
      tags: [Barbearias]
      summary: Cadastra um serviço na barbearia
      description: Exige a role **`gestor`**.
      operationId: criarServico
      parameters:
        - $ref: '#/components/parameters/DemoDelay'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicoIn'
            example:
              nome: Barba
              duracao_min: 20
              preco: 30.00
      responses:
        '201':
          description: Serviço criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Servico'
              example:
                id: e46d60a3-c2dc-422d-8b9a-f97b09ac857c
                barbearia_id: 11111111-1111-1111-1111-111111111111
                nome: Barba
                duracao_min: 20
                preco: "30.00"
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/BarbeariaNaoEncontrada' }
        '422': { $ref: '#/components/responses/ValidacaoFastAPI' }
        '503': { $ref: '#/components/responses/ServicoIndisponivel' }

  /disponibilidade:
    get:
      tags: [Disponibilidade]
      summary: Horários livres de um profissional em um dia
      description: |
        Qualquer usuário autenticado. Devolve a grade fixa do dia, das **09:00 às 18:00** em blocos de
        30 minutos (`America/Sao_Paulo`, offset `-03:00`), menos os blocos ocupados por agendamentos
        confirmados. O último bloco é 17:30–18:00.

        A grade é um **read model** atualizado pelos eventos `agendamento.criado` e
        `agendamento.cancelado` do Kafka (ADR-0008), então a consistência é **eventual**: uma reserva
        feita agora pode levar alguns milissegundos para sumir daqui.
      operationId: consultarDisponibilidade
      parameters:
        - name: profissional_id
          in: query
          required: true
          description: Id do profissional.
          schema:
            type: string
            format: uuid
          example: 22222222-2222-2222-2222-222222222222
        - name: data
          in: query
          required: true
          description: Dia consultado, `AAAA-MM-DD`.
          schema:
            type: string
            format: date
          example: "2026-10-28"
        - $ref: '#/components/parameters/DemoDelay'
      responses:
        '200':
          description: Grade do dia com os blocos livres.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disponibilidade'
              example:
                profissional_id: 22222222-2222-2222-2222-222222222222
                data: "2026-10-28"
                horarios_livres:
                  - inicio: "2026-10-28T09:00:00-03:00"
                    fim: "2026-10-28T09:30:00-03:00"
                  - inicio: "2026-10-28T09:30:00-03:00"
                    fim: "2026-10-28T10:00:00-03:00"
                  - inicio: "2026-10-28T10:30:00-03:00"
                    fim: "2026-10-28T11:00:00-03:00"
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '422':
          description: Parâmetro ausente ou inválido (formato do FastAPI).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroValidacaoFastAPI'
              example:
                detail:
                  - type: missing
                    loc: [query, data]
                    msg: Field required
                    input: null
        '503': { $ref: '#/components/responses/ServicoIndisponivel' }

  /agendamentos:
    post:
      tags: [Agendamentos]
      summary: Reserva um horário
      description: |
        Exige a role **`cliente`**. O `cliente_id` da reserva é sempre o `sub` do token; não vai no
        corpo.

        Dois clientes disputando o mesmo horário do mesmo profissional: o primeiro a gravar recebe
        **201** e o segundo **409**, garantido por uma constraint de exclusão no PostgreSQL
        (ADR-0007). Após gravar, o serviço publica `agendamento.criado` no Kafka, que atualiza a
        disponibilidade e dispara a notificação.

        Regras: `fim` depois de `inicio`; `inicio` no futuro. A grade da disponibilidade não é
        validada aqui: um horário fora dela é aceito, mas nunca aparece em `/disponibilidade`.
      operationId: criarAgendamento
      parameters:
        - $ref: '#/components/parameters/DemoDelay'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoAgendamento'
            example:
              barbearia_id: 11111111-1111-1111-1111-111111111111
              profissional_id: 22222222-2222-2222-2222-222222222222
              servico_id: 33333333-3333-3333-3333-333333333333
              inicio: "2026-10-28T10:00:00-03:00"
              fim: "2026-10-28T10:30:00-03:00"
      responses:
        '201':
          description: Reserva confirmada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agendamento'
              example:
                id: 7ec11d10-3115-4ac7-8c26-9ecd4fd823a4
                inicio: "2026-10-28T10:00:00-03:00"
                fim: "2026-10-28T10:30:00-03:00"
                status: CONFIRMADO
                barbearia_id: 11111111-1111-1111-1111-111111111111
                profissional_id: 22222222-2222-2222-2222-222222222222
                servico_id: 33333333-3333-3333-3333-333333333333
                cliente_id: f271e632-ecc7-43ea-acd0-d547ff943ee3
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '409':
          description: Já existe agendamento confirmado sobreposto para o profissional.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                detail: Horário indisponível para este profissional
        '422':
          description: Corpo inválido (JSON quebrado, campo faltando, UUID inválido) ou regra do agendamento violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                corpo:
                  summary: Campo faltando ou tipo errado
                  value:
                    detail: Dados inválidos
                passado:
                  summary: Horário no passado
                  value:
                    detail: O agendamento precisa ser num horário futuro.
                intervalo:
                  summary: Fim antes do início
                  value:
                    detail: O fim do agendamento precisa ser depois do início.
        '503': { $ref: '#/components/responses/ServicoIndisponivel' }

  /agendamentos/{agendamentoId}:
    delete:
      tags: [Agendamentos]
      summary: Cancela uma reserva
      description: |
        Exige a role **`cliente`**. Só o **dono** da reserva (quem a criou) consegue cancelar. Para
        qualquer outro cliente a resposta é **404**, igual à de um id inexistente, para não revelar
        que a reserva existe. Cancelar uma reserva já cancelada devolve 204 (idempotente).

        Após gravar, o serviço publica `agendamento.cancelado`, e o horário volta à disponibilidade.
      operationId: cancelarAgendamento
      parameters:
        - name: agendamentoId
          in: path
          required: true
          description: Id da reserva, devolvido no `POST /agendamentos`.
          schema:
            type: string
            format: uuid
          example: 7ec11d10-3115-4ac7-8c26-9ecd4fd823a4
        - $ref: '#/components/parameters/DemoDelay'
      responses:
        '204':
          description: Reserva cancelada. Sem corpo.
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404':
          description: Reserva inexistente **ou de outro cliente**.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                detail: Agendamento '7ec11d10-3115-4ac7-8c26-9ecd4fd823a4' não encontrado.
        '422':
          description: Id não é um UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                detail: Dados inválidos
        '503': { $ref: '#/components/responses/ServicoIndisponivel' }

  /health:
    get:
      tags: [Saúde]
      summary: Liveness do BFF
      description: Não exige token. Diz só que o BFF está de pé; não consulta os serviços.
      operationId: health
      security: []
      responses:
        '200':
          description: BFF no ar.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: bff-gateway
                required: [status, service]

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token do Keycloak (realm `barbearia`). O BFF exige `iss` igual à URL do realm que ele
        conhece e `aud` contendo `bff-gateway`. Como obter: seção *Autenticação* da descrição da API.

  parameters:
    BarbeariaId:
      name: barbeariaId
      in: path
      required: true
      description: Id da barbearia.
      schema:
        type: string
        format: uuid
      example: 11111111-1111-1111-1111-111111111111
    DemoDelay:
      name: X-Demo-Delay-Ms
      in: header
      required: false
      description: |
        Só para demonstração de observabilidade: atrasa a resposta do BFF em N milissegundos
        (1 a 5000) antes de encaminhar, para a latência aparecer nos dashboards do Grafana.
      schema:
        type: integer
        minimum: 1
        maximum: 5000
      example: 800

  responses:
    NaoAutenticado:
      description: |
        Token ausente, expirado, com assinatura, `iss` ou `aud` inválidos. O motivo vai no header
        `WWW-Authenticate` (RFC 6750 §3), não no corpo.
      headers:
        WWW-Authenticate:
          description: Desafio Bearer com `error` e `error_description` quando houve token.
          schema:
            type: string
          example: Bearer realm="barbearia", error="invalid_token", error_description="Jwt expired at 2026-10-28T21:05:00Z"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            detail: Token ausente ou inválido
    SemPermissao:
      description: Token válido, mas sem a role que a operação exige.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            detail: Permissão insuficiente para esta operação
    BarbeariaNaoEncontrada:
      description: Não existe barbearia com esse id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            detail: Barbearia nao encontrada
    ValidacaoFastAPI:
      description: Corpo ou parâmetro inválido, no formato de validação do FastAPI/Pydantic.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroValidacaoFastAPI'
          example:
            detail:
              - type: string_too_short
                loc: [body, nome]
                msg: String should have at least 1 character
                input: ""
                ctx: { min_length: 1 }
    ServicoIndisponivel:
      description: |
        O serviço de destino não respondeu (conexão, timeout) ou o circuit breaker dele está aberto.
        O token já foi aceito: só uma requisição autenticada e autorizada chega a este ponto.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            detail: agendamento-service indisponível

  schemas:

    Erro:
      type: object
      description: Formato de erro do BFF e do agendamento-service.
      properties:
        detail:
          type: string
          description: Mensagem legível, em português.
      required: [detail]
      example:
        detail: Horário indisponível para este profissional

    ErroValidacaoFastAPI:
      type: object
      description: Formato dos 422 dos serviços em FastAPI (barbearia e disponibilidade).
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              type: { type: string, example: missing }
              loc:
                type: array
                items: { type: string }
                example: [body, nome]
              msg: { type: string, example: Field required }
              input: { description: Valor recebido. }
              ctx: { type: object, additionalProperties: true }
      required: [detail]

    BarbeariaIn:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 100
        endereco:
          type: string
          minLength: 1
          maxLength: 200
      required: [nome, endereco]

    Barbearia:
      allOf:
        - $ref: '#/components/schemas/BarbeariaIn'
        - type: object
          properties:
            id:
              type: string
              format: uuid
          required: [id]
      example:
        id: 11111111-1111-1111-1111-111111111111
        nome: Barbearia Centro
        endereco: Rua da Bahia 1000

    ProfissionalIn:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 100
      required: [nome]

    Profissional:
      allOf:
        - $ref: '#/components/schemas/ProfissionalIn'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            barbearia_id:
              type: string
              format: uuid
          required: [id, barbearia_id]
      example:
        id: 22222222-2222-2222-2222-222222222222
        barbearia_id: 11111111-1111-1111-1111-111111111111
        nome: Carlos

    ServicoIn:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 100
        duracao_min:
          type: integer
          minimum: 1
          description: Duração em minutos.
        preco:
          type: number
          minimum: 0
          exclusiveMinimum: true
          multipleOf: 0.01
          description: Preço em reais, até 2 casas decimais. Aceita número ou string (`"40.00"`).
      required: [nome, duracao_min, preco]

    Servico:
      type: object
      properties:
        id:
          type: string
          format: uuid
        barbearia_id:
          type: string
          format: uuid
        nome:
          type: string
        duracao_min:
          type: integer
        preco:
          type: string
          description: Decimal serializado como string com 2 casas, para não perder precisão.
          example: "40.00"
      required: [id, barbearia_id, nome, duracao_min, preco]
      example:
        id: 33333333-3333-3333-3333-333333333333
        barbearia_id: 11111111-1111-1111-1111-111111111111
        nome: Corte
        duracao_min: 30
        preco: "40.00"

    HorarioLivre:
      type: object
      properties:
        inicio:
          type: string
          format: date-time
          example: "2026-10-28T09:00:00-03:00"
        fim:
          type: string
          format: date-time
          example: "2026-10-28T09:30:00-03:00"
      required: [inicio, fim]

    Disponibilidade:
      type: object
      properties:
        profissional_id:
          type: string
          format: uuid
        data:
          type: string
          format: date
        horarios_livres:
          type: array
          description: Blocos de 30 min livres, em ordem crescente. Vazio se o dia estiver todo ocupado.
          items:
            $ref: '#/components/schemas/HorarioLivre'
      required: [profissional_id, data, horarios_livres]

    NovoAgendamento:
      type: object
      description: "Corpo da reserva. Não tem `cliente_id`: ele vem do token."
      properties:
        barbearia_id:
          type: string
          format: uuid
        profissional_id:
          type: string
          format: uuid
        servico_id:
          type: string
          format: uuid
        inicio:
          type: string
          format: date-time
          description: Início, com offset. Precisa ser no futuro.
          example: "2026-10-28T10:00:00-03:00"
        fim:
          type: string
          format: date-time
          description: Fim, com offset. Precisa ser depois de `inicio`.
          example: "2026-10-28T10:30:00-03:00"
      required: [barbearia_id, profissional_id, servico_id, inicio, fim]

    Agendamento:
      type: object
      properties:
        id:
          type: string
          format: uuid
        inicio:
          type: string
          format: date-time
        fim:
          type: string
          format: date-time
        status:
          type: string
          enum: [CONFIRMADO, CANCELADO]
          description: Só `CONFIRMADO` ocupa o horário.
        barbearia_id:
          type: string
          format: uuid
        profissional_id:
          type: string
          format: uuid
        servico_id:
          type: string
          format: uuid
        cliente_id:
          type: string
          description: Claim `sub` do token de quem reservou.
      required: [id, inicio, fim, status, barbearia_id, profissional_id, servico_id, cliente_id]
      example:
        id: 7ec11d10-3115-4ac7-8c26-9ecd4fd823a4
        inicio: "2026-10-28T10:00:00-03:00"
        fim: "2026-10-28T10:30:00-03:00"
        status: CONFIRMADO
        barbearia_id: 11111111-1111-1111-1111-111111111111
        profissional_id: 22222222-2222-2222-2222-222222222222
        servico_id: 33333333-3333-3333-3333-333333333333
        cliente_id: f271e632-ecc7-43ea-acd0-d547ff943ee3
