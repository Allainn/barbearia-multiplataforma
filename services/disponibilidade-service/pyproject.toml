[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "disponibilidade-service"
version = "1.0.0"
description = "Barbearia — Disponibilidade Service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.0",  # telemetry={"auto_configure": False} em main.py
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "kafka-python>=2.0.2",
    "tzdata>=2024.1",  # a imagem python:slim nao traz o banco de fusos (America/Sao_Paulo)
    "sqlalchemy>=2.0.0,<2.1.0",  # pin: 2.1 muda a resolucao default do driver postgres, quebra psycopg2
    "psycopg2-binary>=2.9.9",
    "tenacity>=8.2.0",
    # observabilidade
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.44b0",
    "opentelemetry-instrumentation-logging>=0.44b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.44b0",
]

[tool.setuptools.packages.find]
where = ["src"]
