name: App Flutter (barberhub-app)

# O build do APK é critério eliminatório do Projeto Final: todo PR que mexe no app
# passa por analyze, testes e build antes do merge (ADR-0016).
on:
  push:
    branches:
      - main
    paths:
      - 'apps/barberhub-app/**'
      - '.github/workflows/barberhub-app.yml'
  pull_request:
    paths:
      - 'apps/barberhub-app/**'
      - '.github/workflows/barberhub-app.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/barberhub-app

jobs:
  build:
    name: Analyze, testes e APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: Build do APK (o mesmo comando do professor)
        run: flutter build apk --debug

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: barberhub-app-debug
          path: apps/barberhub-app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
