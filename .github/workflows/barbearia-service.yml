name: Publicar barbearia-service

on:
  push:
    branches:
      - main
      - 'demo/**'
    paths:
      - 'services/barbearia-service/**'
      - '.github/workflows/barbearia-service.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/allainn/barbearia-multiplataforma/barbearia-service

jobs:
  build-and-push:
    name: Build e push da imagem
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Executar smoke test
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./services/barbearia-service
          python -c "import barbearia.main"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: ./services/barbearia-service
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
