name: barberhub_app
description: "App mobile do BarberHub: agendamento em barbearias."
publish_to: 'none'
version: 0.1.0+1

environment:
  # Versão do grupo: Flutter 3.47 (ver README). O piso fica baixo só para o analisador
  # não recusar o projeto; o pubspec.lock commitado pede Flutter 3.44 ou mais novo.
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.3
  # skeleton com brilho no carregamento das listas (dica do enunciado)
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # geram ícone e splash a partir de assets/icon/ (rodar só quando a arte mudar, ver README)
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  # Fontes embarcadas (licença OFL em assets/fonts/): funcionam sem internet.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
    - family: DM Serif Display
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf

# dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: "#1F3A5F"
  adaptive_icon_foreground: assets/icon/foreground.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#1F3A5F"
    theme_color: "#1F3A5F"

# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#1F3A5F"
  image: assets/icon/splash.png
  android_12:
    color: "#1F3A5F"
    image: assets/icon/splash-android12.png
  web: true
